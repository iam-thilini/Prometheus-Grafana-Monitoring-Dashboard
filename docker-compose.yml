services:
  prometheus:
    image: prom/prometheus
    container_name: local-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana
    container_name: local-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus